<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weed Annotator">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Weed Annotator</title>
<style>
/* The visual language of the iPad app: greyscale chrome; the only saturated colours are the
   plant labels and the three that always mean the same thing (alert, good, caution). */
:root {
  --surface: #171717; --raised: #2b2b2b; --hairline: rgba(255,255,255,.12); --secondary: rgba(255,255,255,.62);
  --control: rgba(255,255,255,.14); --alert: #ff453a; --good: #30d158; --caution: #ffd60a;
  --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
  --left: env(safe-area-inset-left, 0px); --right: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
svg.icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.glyph { width: 22px; height: 22px; flex: none; }
.caption { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--secondary); }

/* The app's one button shape. Plain: a quiet secondary button. `.primary`: the screen's one main action. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px;
  border-radius: 12px; background: var(--control); font-weight: 600; white-space: nowrap; }
a.btn { color: inherit; text-decoration: none; }
.btn.primary { background: #fff; color: #000; }
.btn.good { background: var(--good); color: #000; }
.btn.danger { color: var(--alert); }
.btn.big { min-height: 52px; padding: 0 18px; font-size: 17px; }
.btn.square { width: 42px; padding: 0; }
.btn:disabled { opacity: .35; }
.btn:active:not(:disabled) { opacity: .7; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 13px; border-radius: 12px;
  background: var(--control); font-weight: 600; white-space: nowrap; flex: none; }
.chip.on { background: var(--chip, #fff); color: #000; }
.panel { background: rgba(20,20,20,.72); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border: 1px solid var(--hairline); border-radius: 18px; }

/* Camera: status along the top, the newest photo and the way into labelling bottom left, the shutter bottom right. */
#camera { position: fixed; inset: 0; background: #000; }
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
#flash.on { opacity: .6; transition: none; }
#camera .chrome { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  padding: calc(12px + var(--top)) calc(12px + var(--right)) calc(14px + var(--bottom)) calc(12px + var(--left)); }
#camera .chrome > * { pointer-events: auto; }
#status { display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 0 16px; border-radius: 22px; font-weight: 600; }
#status span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#status .grow { flex: 1; }
.btn.help { height: 32px; padding: 0 12px; border-radius: 16px; font-size: 15px; flex: none; }
#status .help { margin-right: -8px; }
#toast { align-self: center; padding: 10px 14px; font-size: 14px; max-width: 340px; text-align: center; }
#ring { position: fixed; width: 76px; height: 76px; margin: -38px 0 0 -38px; border: 1.5px solid #fff; border-radius: 10px; pointer-events: none; }
#banner { padding: 10px 14px; border-radius: 14px; background: var(--alert); font-weight: 600; }
#middle { flex: 1; display: flex; align-items: center; justify-content: center; pointer-events: none !important; }
#nocam { pointer-events: auto; max-width: 440px; padding: 22px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
#nocam h2 { margin: 0; font-size: 20px; }
#nocam p { margin: 0; color: var(--secondary); }
#controls { display: flex; align-items: flex-end; gap: 14px; }
#controls .left { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
#controls .pair { display: flex; flex-wrap: wrap; gap: 10px; }
#latest { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; width: min(340px, 100%); text-align: left; }
#latest .thumb { width: 84px; height: 72px; border-radius: 10px; background: rgba(255,255,255,.08) center/cover; flex: none; }
#latest .text { flex: 1; min-width: 0; }
#latest .line { display: flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 600; white-space: nowrap; }
#latest .sub { color: var(--secondary); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 400px) { #latest .thumb { width: 60px; height: 52px; } #latest { gap: 10px; padding-right: 10px; } }
#shutter { width: 92px; height: 92px; border-radius: 50%; border: 5px solid #fff; background: rgba(0,0,0,.35); flex: none; position: relative; }
#shutter::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #fff; transition: transform .1s; }
#shutter:active::after { transform: scale(.9); }
#shutter:disabled { opacity: .35; }

/* Labelling: toolbar, the photo, the list of photos, the inspector. */
#label { position: fixed; inset: 0; background: var(--surface); display: grid; grid-template-rows: auto 1fr auto auto auto;
  grid-template-columns: 100%; padding: var(--top) var(--right) var(--bottom) var(--left); }
#toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--hairline); min-width: 0; }
#toolbar .title { flex: 1; min-width: 0; }
#toolbar .title b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toolbar .title small { display: block; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#stage { position: relative; min-height: 0; background: #000; overflow: hidden; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
/* What to do now, in a line under the photo. Its height is fixed so that the photo does not jump when the words change. */
#guide { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 12px; border-top: 1px solid var(--hairline); min-width: 0; }
#guide .text { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.25; color: var(--secondary); max-height: 34px; overflow: hidden; }
#guide .text b { color: #fff; font-weight: 600; }
#list { display: flex; align-items: flex-start; gap: 6px; padding: 8px 12px; overflow-x: auto; border-top: 1px solid var(--hairline); scrollbar-width: none; }
#list::-webkit-scrollbar { display: none; }
#listhead { display: none; }
.row { display: flex; align-items: center; gap: 10px; padding: 3px; border-radius: 10px; border: 2px solid transparent; position: relative; flex: none; text-align: left; }
.row.on { border-color: #fff; }
.row .thumb { width: 56px; height: 48px; border-radius: 6px; background: rgba(255,255,255,.06) center/cover; flex: none; }
.row .text { display: none; min-width: 0; flex: 1; }
.row .name { display: flex; align-items: center; gap: 5px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.row .name.dim, .row .cap { color: var(--secondary); }
.row .cap { font-size: 12px; white-space: nowrap; }
.row .tick { position: absolute; right: 1px; bottom: 1px; width: 18px; height: 18px; border-radius: 50%; background: var(--good); color: #000;
  display: flex; align-items: center; justify-content: center; font-size: 12px; }
.row .tick svg { width: 12px; height: 12px; stroke-width: 3; }
#inspector { display: flex; flex-direction: column; gap: 9px; padding: 10px 12px; border-top: 1px solid var(--hairline); }
#inspector .line { display: flex; align-items: center; gap: 8px; min-width: 0; }
#inspector .caption { width: 44px; flex: none; }
/* Chips wrap rather than scroll: every label is on screen, the typed one included. */
#inspector .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
#inspector .dimmed { opacity: .35; pointer-events: none; }
#inspector .photo { border-bottom: 1px solid var(--hairline); padding-bottom: 9px; }
#inspector .photo .grow { flex: 1; }
@media (max-width: 560px) { .btn .wide { display: none; } }
/* "(no weeds)" is spelt out on the button only where the row has room for it; the line above the photos says it everywhere. */
#weedfree .extra { display: none; }
@media (orientation: portrait) and (min-width: 390px) { #weedfree .extra { display: inline; } }

/* Held sideways: the photo keeps the height, everything else sits in a column beside it. */
@media (orientation: landscape) {
  #label { grid-template-columns: 1fr min(330px, 50%); grid-template-rows: auto auto auto minmax(64px, 1fr) auto; }
  #toolbar { grid-column: 1 / 3; }
  #stage { grid-column: 1; grid-row: 2 / 6; }
  #guide { grid-column: 2; grid-row: 2; border-top: 0; border-left: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
  #list { grid-column: 2; grid-row: 4; border-top: 0; border-left: 1px solid var(--hairline); align-content: flex-start; }
  #inspector { grid-column: 2; grid-row: 5; border-left: 1px solid var(--hairline); }
  .btn .wide { display: none; }
}
/* A phone held sideways has little height: the row titles go, so each row of chips fits on one line. */
@media (orientation: landscape) and (max-height: 639px) {
  #inspector .caption { display: none; }
  #inspector { gap: 7px; padding: 8px 10px; }
  .chip { padding: 0 11px; }
}
@media (orientation: landscape) and (min-height: 640px) {
  #listhead { display: flex; grid-column: 2; grid-row: 3; align-items: center; justify-content: space-between; padding: 0 14px; height: 38px;
    border-left: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
  #listhead small { color: var(--secondary); }
  #label { grid-template-columns: 1fr min(380px, 42%); }
  #list { flex-direction: column; align-items: stretch; overflow-x: hidden; overflow-y: auto; gap: 2px; padding: 8px; }
  .row { border: 0; padding: 7px; }
  .row.on { background: var(--raised); }
  .row .text { display: block; }
  .row .tick { position: static; }
}

/* Sheets and prompts. */
#days { position: fixed; inset: 0; background: var(--surface); display: flex; flex-direction: column; padding: var(--top) var(--right) var(--bottom) var(--left); }
#days header { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--hairline); }
#days header b { flex: 1; font-size: 17px; }
#daylist { flex: 1; overflow-y: auto; padding: 6px 12px; -webkit-overflow-scrolling: touch; }
.day { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
.day .open { flex: 1; text-align: left; display: flex; align-items: center; gap: 12px; min-width: 0; }
.day .open div { flex: 1; min-width: 0; }
.day b { display: block; font-size: 16px; }
.day small, #days footer { color: var(--secondary); }
#days footer { padding: 10px 14px; font-size: 13px; border-top: 1px solid var(--hairline); }
.empty { text-align: center; color: var(--secondary); padding: 60px 20px; }
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: flex-start;
  padding: calc(64px + var(--top)) 14px 14px; }
#dialog { width: min(480px, 100%); max-height: 100%; overflow-y: auto; background: var(--raised); border: 1px solid var(--hairline); border-radius: 18px; padding: 18px;
  display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
#dialog ol { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 12px; }
#dialog li::marker { font-weight: 700; }
#dialog li span { color: var(--secondary); }
#dialog h3 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 9px; }
#dialog p { margin: 0; }
#dialog .dim { color: var(--secondary); }
#dialog .warn { color: var(--caution); display: flex; gap: 8px; align-items: center; }
#dialog input { font: inherit; font-size: 20px; color: #fff; background: var(--control); border: 0; border-radius: 12px; height: 52px;
  padding: 0 14px; width: 100%; outline: none; -webkit-user-select: text; user-select: text; }
#dialog .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
</style>
</head>
<body>

<main id="camera">
  <video id="video" playsinline muted autoplay></video>
  <div id="flash"></div>
  <div id="ring" hidden></div>
  <div class="chrome">
    <div id="status" class="panel"></div>
    <div id="banner" hidden></div>
    <div id="toast" class="panel" hidden></div>
    <div id="middle"><div id="nocam" class="panel" hidden></div></div>
    <div id="controls">
      <div class="left">
        <button id="latest" class="panel" hidden></button>
        <div class="pair">
          <button id="alldays" class="btn"></button>
          <button id="exportnow" class="btn" hidden></button>
        </div>
      </div>
      <button id="shutter" aria-label="Take photo"></button>
    </div>
  </div>
</main>

<main id="label" hidden>
  <div id="toolbar"></div>
  <div id="stage"><canvas id="canvas"></canvas></div>
  <div id="guide"></div>
  <div id="listhead"><span class="caption">PHOTOS</span><small id="listcount"></small></div>
  <div id="list"></div>
  <div id="inspector"></div>
</main>

<div id="days" hidden>
  <header><b>All days</b><button id="daysclose" class="btn">Close</button></header>
  <div id="daylist"></div>
  <footer id="daysfoot"></footer>
</div>

<div id="overlay" hidden><div id="dialog"></div></div>
<input id="picker" type="file" accept="image/*" capture="environment" hidden>

<script>
"use strict";
// Weed Annotator for phones: the same job as the iPad app, with the phone's own camera.
// Take a photo of a plant, box what is in it, say what it is and how far along, export.
// Everything is kept on this phone and works without a network.
const VERSION = "2026-11-17";

// ---------- What a box can say ----------

// The target species, then the look-alike class. The first is what a new box starts as.
// Ids and names match the iPad app, so that exports from both merge into one dataset.
const PRESETS = [
  { id: "giant-rats-tail-grass", name: "Giant rat's tail grass", short: "Rat's tail", isWeed: true, color: "#ff9e0a", glyph: "ratsTail" },
  { id: "lantana", name: "Lantana", short: "Lantana", isWeed: true, color: "#c778ff", glyph: "lantana" },
  { id: "look-alike", name: "Look-alike, not a weed", short: "Look-alike", isWeed: false, color: "#63d1ff", glyph: "lookAlike" },
];
const STAGES = [["early", "Early"], ["mature", "Mature"], ["unsure", "Unsure"]];
/** Grey for a label typed in the field, which has no colour of its own. */
const TYPED_COLOR = "#8e8e93";
const preset = id => PRESETS.find(p => p.id === id);
const labelName = id => preset(id)?.name ?? id;
const labelColor = id => preset(id)?.color ?? TYPED_COLOR;

/** The label a typed name stands for: a preset when it names one, otherwise the name itself, tidied. Null when nothing was typed. */
function typedLabel(text) {
  const name = text.trim().split(/\s+/).filter(Boolean).join(" ");
  if (!name) return null;
  const same = other => other.toLowerCase() === name.toLowerCase();
  return PRESETS.find(p => same(p.id) || same(p.name) || same(p.short))?.id ?? name.slice(0, 40);
}

// ---------- Small helpers ----------

const $ = id => document.getElementById(id);
/** Builds an element; text always goes in as text, so a typed label can never become markup. */
function h(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key === "style") node.style.cssText = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value === true) node.setAttribute(key, "");
    else if (value !== false && value != null) node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child != null && child !== false) node.append(child);
  return node;
}
const ICONS = {
  back: "M15 5l-7 7 7 7", next: "M9 5l7 7-7 7", export: "M12 15V4m0 0l-4 4m4-4l4 4M5 12v7h14v-7",
  trash: "M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5", check: "M5 12.5l4.5 4.5L19 7.5",
  arrow: "M5 12h14m0 0l-5-5m5 5l-5 5", leaf: "M5 19c0-8 5-13 14-14 0 9-5 14-13 14zM5 19l7-7",
  calendar: "M5 7h14v12H5zM5 11h14M9 5v4M15 5v4", type: "M9 5h6M12 5v14M9 19h6", x: "M6 6l12 12M18 6L6 18",
  info: "M12 21a9 9 0 100-18 9 9 0 000 18zM12 11v6M12 7.5v.5",
  frame: "M5 9V5h4M15 5h4v4M19 15v4h-4M9 19H5v-4",
  pin: "M12 21s6-5.5 6-11a6 6 0 10-12 0c0 5.5 6 11 6 11zM12 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z",
  camera: "M4 8h3l2-2h6l2 2h3v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z",
};
function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "icon");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", ICONS[name]);
  svg.append(path);
  return svg;
}

/** A small drawing of a plant on a 24-point grid, so a label can be told by shape as well as colour: the same drawings as the iPad app. */
function glyph(kind, color) {
  const leaf = (a, b, bend, width) => {
    const length = Math.max(Math.hypot(b[0] - a[0], b[1] - a[1]), 0.001);
    const control = offset => [(a[0] + b[0]) / 2 - (b[1] - a[1]) / length * 2 * offset, (a[1] + b[1]) / 2 + (b[0] - a[0]) / length * 2 * offset];
    const [c1, c2] = [control(bend + width / 2), control(bend - width / 2)];
    return `<path fill="${color}" d="M${a} Q${c1} ${b} Q${c2} ${a}Z"/>`;
  };
  const rod = (a, b, width) => `<path fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" d="M${a} L${b}"/>`;
  const ground = `<rect fill="${color}" x="5" y="21.4" width="14" height="1.9" rx=".95"/>`;
  let body;
  if (kind === "ratsTail") {
    body = leaf([10, 22], [2.4, 14.5], 1.6, 3.2) + leaf([13.2, 22], [21.6, 15.5], -1.6, 3.2) + rod([12, 21.5], [13.4, 12.5], 1.4) +
      rod([13.5, 13], [15.4, 2.3], 3) + rod([10.9, 21.5], [8.7, 14.5], 1.3) + rod([8.6, 15], [6.4, 7.2], 2.6) + ground;
  } else if (kind === "lantana") {
    const dots = [[12, 8.2], ...[0, 1, 2, 3, 4, 5].map(i => [12 + 5.2 * Math.cos((i * 60 + 30) * Math.PI / 180), 8.2 + 5.2 * Math.sin((i * 60 + 30) * Math.PI / 180)])];
    body = dots.map(([x, y]) => `<circle fill="${color}" cx="${x}" cy="${y}" r="2.4"/>`).join("") +
      `<rect fill="${color}" x="10.9" y="14.5" width="2.2" height="8.5" rx=".6"/>` + leaf([12, 21.8], [4.2, 16.8], 0, 4.4) + leaf([12, 21.8], [19.8, 16.8], 0, 4.4);
  } else if (kind === "lookAlike") {
    body = leaf([9.5, 22], [1.8, 11], 2.2, 3.6) + leaf([10.8, 22], [7, 3.5], 1, 3.6) + leaf([13.2, 22], [17, 3.5], -1, 3.6) + leaf([14.5, 22], [22.2, 11], -2.2, 3.6) + ground;
  } else {
    body = `<circle fill="${color}" cx="12" cy="12" r="5"/>`;
  }
  const wrap = document.createElement("span");
  wrap.style.display = "inline-flex";
  wrap.innerHTML = `<svg class="glyph" viewBox="0 0 24 24">${body}</svg>`;
  return wrap.firstChild;
}
const labelGlyph = (id, color = labelColor(id)) => glyph(preset(id)?.glyph ?? "typed", color);

const dayOf = at => { const d = new Date(at); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const dayTitle = day => new Date(day + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const clock = at => new Date(at).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const count = (n, noun, plural = noun + "s") => n === 1 ? `1 ${noun}` : `${n} ${plural}`;

// ---------- Storage on this phone ----------
// `photos` holds what is said about each photo and a thumbnail; `blobs` holds the photo itself,
// kept apart so that moving a box does not rewrite megabytes.

let db;
function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("weed-annotator", 1);
    request.onupgradeneeded = () => {
      request.result.createObjectStore("photos", { keyPath: "id" });
      request.result.createObjectStore("blobs", { keyPath: "id" });
    };
    request.onsuccess = () => {
      // A second tab with a newer version of the page must not be kept waiting by this one.
      request.result.onversionchange = () => request.result.close();
      resolve(request.result);
    };
    request.onerror = () => reject(request.error);
  });
}
function store(names, mode, work) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(names, mode);
    const result = work(...[].concat(names).map(name => transaction.objectStore(name)));
    transaction.oncomplete = () => resolve(result?.result);
    transaction.onerror = transaction.onabort = () => reject(transaction.error);
  });
}

/** Every photo on this phone, oldest first. Each: id, at, day, thumb, width, height, location, boxes, isWeedFree. */
let photos = [];
const isLabelled = photo => photo.boxes.length > 0 || photo.isWeedFree;
const photosOf = day => photos.filter(p => p.day === day);

  for (const id of ids) { URL.revokeObjectURL(thumbURLs.get(id)); thumbURLs.delete(id); }

const thumbURLs = new Map();

  return thumbURLs.get(photo.id);

// ---------- Camera and position ----------

const video = $("video");
let stream = null;
/** "starting", "live", "denied" or "unavailable". */
let cameraState = "starting";
let busy = false;
let problem = null;
function fail(message) { problem = message; renderCamera(); }

/** Which camera to open, once the phone's cameras have been listed: undefined before that, its id, or null to keep the browser's choice. */
let mainCamera;
/** Counts camera openings, so that one still under way when the camera is let go does not turn it back on. */
let opening = 0;
async function startCamera() {
  if (stream || !$("label").hidden) return;
  const mine = ++opening;
  // 4032×3024 is the 12-megapixel photograph of a phone camera; a browser without it gives the nearest it has.
  // A photo is a still of the live picture's size, or failing that a frame of it.
  const ask = which => navigator.mediaDevices.getUserMedia({ audio: false, video: { ...which, width: { ideal: 4032 }, height: { ideal: 3024 } } });
  let got = null;
  try {
    got = await ask(mainCamera ? { deviceId: { exact: mainCamera } } : { facingMode: { ideal: "environment" } });
    if (mainCamera === undefined) {
      // The back camera an iPhone hands a page joins all its lenses into one, and changes lens by itself when
      // something comes nearer than about 20 cm: the picture jumps and refocuses. The camera it lists as
      // "Back Camera" is the main lens alone, which stays put (it cannot focus nearer than about 20 cm).
      // Cameras have names only once the page is allowed one, hence the two openings the first time.
      const main = (await navigator.mediaDevices.enumerateDevices()).find(d => d.kind === "videoinput" && d.label === "Back Camera");
      mainCamera = main?.deviceId || null;
      if (mainCamera && got.getVideoTracks()[0]?.label !== "Back Camera") {
        got.getTracks().forEach(track => track.stop());
        got = await ask({ deviceId: { exact: mainCamera } });
      }
    }
    if (mine !== opening) { got.getTracks().forEach(track => track.stop()); return; }
    stream = got;
    video.srcObject = stream;
    await video.play();
    cameraState = "live";
  } catch (error) {
    if (mine !== opening) return;
    stream = null;
    // The main lens could not be opened by its id: the browser's own choice of camera instead.
    if (mainCamera) { mainCamera = null; return startCamera(); }
    cameraState = error?.name === "NotAllowedError" ? "denied" : "unavailable";
  }
  renderCamera();
}
function stopCamera() {
  opening++;
  stream?.getTracks().forEach(track => track.stop());

}

/** Where the phone last knew it was. A fix older than half a minute is not used for a photo. */
let fix = null;

/** Draws a picture upright into a JPEG no larger than 4032 on its long side (the limit of a canvas on a phone), with a thumbnail. */
async function encode(source, width, height) {
  const scale = Math.min(1, 4032 / Math.max(width, height));
  const draw = (w, h) => {
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(source, 0, 0, w, h);
    return canvas;
  };
  const jpeg = (canvas, quality) => new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));

  const small = 320 / Math.max(width, height);
  const blob = await jpeg(full, 0.92), thumb = await jpeg(draw(Math.round(width * small), Math.round(height * small)), 0.8);
  if (!blob || !thumb) throw new Error("encoding failed");
  return { blob, thumb, width: full.width, height: full.height };
}

}

/** How much fine detail the live picture has right now: the squared second difference between
    neighbouring pixels in the middle of the frame, at the camera's own resolution. A shaken or
    unfocused frame scores lower than a steady one of the same scene. */

  const size = Math.min(384, video.videoWidth, video.videoHeight);

  context.drawImage(video, (video.videoWidth - size) / 2, (video.videoHeight - size) / 2, size, size, 0, 0, size, size);
  const data = context.getImageData(0, 0, size, size).data, row = size * 4;
  let total = 0;
  for (let y = 1; y < size - 1; y++) {
    for (let i = y * row + 5, end = (y + 1) * row - 4; i < end; i += 4) {
      const d = 4 * data[i] - data[i - 4] - data[i + 4] - data[i - row] - data[i + row];
      total += d * d;
    }

}
/** A frame of the live picture, chosen for sharpness. The tap on the shutter shakes the phone, and
    a camera's live picture can use a long exposure in dim light, so the frame at the tap is often
    smeared. Several frames are looked at over half a second and the one with most fine detail kept. */

    const timer = setTimeout(resolve, 120);

  });

  for (let frames = 0; frames < 8 && performance.now() - started < 500; frames++) {
    const score = sharpness();
    if (score > best) { best = score; context.drawImage(video, 0, 0, canvas.width, canvas.height); }
    await nextFrame();

/** `capture` says how the picture was made: "still" (the browser's still photo), "frame" (a frame of the live picture) or "app" (the phone's camera app, when the page has no camera). */
async function addPhoto(source, width, height, location, capture) {
  const at = Date.now();
  const picture = await encode(source, width, height);
  const photo = { id: `${at}-${Math.random().toString(36).slice(2, 8)}`, at, day: dayOf(at), thumb: picture.thumb, width: picture.width, height: picture.height, capture,
    location: location && { latitude: location.latitude, longitude: location.longitude, altitude: location.altitude, accuracy: location.accuracy }, boxes: [], isWeedFree: false };
  await store(["photos", "blobs"], "readwrite", (a, b) => { a.put(photo); b.put({ id: photo.id, blob: picture.blob }); });
  photos.push(photo);
  navigator.storage?.estimate?.().then(e => {
    if (e?.quota && e.usage / e.quota > 0.85) fail("Storage for this page is nearly full. Export, then delete days you no longer need.");
  });

/** Whether this browser's camera has given a still photo: null before the first try, then true or false. */
let stills = null;
/** The shutter: a photo of what the live picture shows, with the position the phone has right now. */
async function takePhoto() {
  // The live picture has no real size for a moment after the camera starts; a press then is ignored.
  if (busy || cameraState !== "live" || video.videoWidth < 320) return;
  busy = true; problem = null;
  const location = currentFix();
  $("flash").classList.add("on");
  requestAnimationFrame(() => requestAnimationFrame(() => $("flash").classList.remove("on")));
  // A still takes a second or more (1.4 s measured on an iPhone), and the phone has to be steady for all of it.
  if (stills) note("Hold still…");
  renderCamera();
  let reopen = false;
  try {
    let source = null, width = video.videoWidth, height = video.videoHeight, capture = "frame";
    // A still is what the camera makes when asked for a photograph rather than a frame of video: on an
    // iPhone it is the same size as the frame and holds about three times the fine detail (measured once).
    const track = stream.getVideoTracks()[0];
    if (window.ImageCapture && track && stills !== false) {
      try {
        const still = await Promise.race([new ImageCapture(track).takePhoto(), new Promise((_, reject) => setTimeout(reject, 4000))]);
        const image = await decoded(still);
        if (image.naturalWidth * image.naturalHeight >= width * height) [source, width, height, capture] = [image, image.naturalWidth, image.naturalHeight, "still"];
        stills = true;
      } catch {
        // Safari refuses every still after one has failed, until the camera is opened again (seen on an
        // iPhone). A camera that never gave one is not asked again.
        if (stills) reopen = true; else stills = false;
      }
    }
    if (!source) { source = await steadiestFrame(); width = source.width; height = source.height; }
    if (!width || !height) throw new Error("no picture");
    await addPhoto(source, width, height, location, capture);
  } catch {
    problem = "The photo could not be saved. Try again; if it keeps failing the phone may be out of storage.";
  }
  busy = false;
  $("toast").hidden = true;
  if (reopen && $("label").hidden) { stopCamera(); cameraState = "starting"; startCamera(); }
  renderCamera();
}

/** A photo taken in the phone's own camera app, for when this page is not allowed the camera. */
async function importPhoto(file) {
  if (!file) return;
  busy = true; problem = null; renderCamera();
  try {
    const image = await decoded(file);
    await addPhoto(image, image.naturalWidth, image.naturalHeight, currentFix(), "app");
  } catch {
    problem = "That photo could not be read.";
  }
  busy = false;
  // The phone's camera app takes the camera away from the page; a live picture that did not come back is started again.
  if (stream && stream.getVideoTracks()[0]?.readyState !== "live") { stopCamera(); cameraState = "starting"; startCamera(); }
  renderCamera();
}

// ---------- Camera screen ----------

    h("button", { class: "btn help", onclick: showGuide }, icon("info"), "Help"));

let noteTimer = 0;

/** A tap on the live picture asks the camera to focus there. Only some browsers let a page do that (Chrome on Android; not Safari on iPhone), and where it cannot be done the tap says so. */
$("camera").addEventListener("click", async event => {
  if (cameraState !== "live" || event.target.closest("button, .panel, #banner")) return;
  const track = stream?.getVideoTracks()[0], modes = track?.getCapabilities?.().focusMode ?? [];
  // "single-shot" focuses once on the point; a camera that only has "continuous" is asked to look again there.
  const single = ["single-shot", "continuous"].find(m => modes.includes(m));
  if (!single) { note("This phone's browser does not let the page focus where you tap. The camera focuses by itself."); return; }

// ---------- Labelling ----------
// One rule for every chip in the plant row, the typed one included: with a box selected, the chip

// differs only in needing a name, which is asked for at the moment a box is to get it.

const L = {
  day: null, index: 0,
  selected: null,
  /** The box waiting for its label to be typed: { rect } just drawn, or { id } already in the photo. */

  /** What the next box will be; null means a label typed for each box once it is drawn. */

  image: null, imageFor: null,
  zoom: 1, panX: 0, panY: 0,

const list = () => photosOf(L.day);
const current = () => list()[L.index];
const selectedBox = () => current()?.boxes.find(b => b.id === L.selected);
const activeType = () => selectedBox()?.weedTypeID ?? L.nextType;

function change(edit) {
  const photo = current();
  if (!photo) return;
  edit(photo);
  // What was exported no longer says what the photo says now.
  photo.exported = false;
  savePhoto(photo);
  renderLabel();
}
function setType(id) {
  L.nextType = id;
  if (L.selected) change(photo => { photo.boxes.find(b => b.id === L.selected).weedTypeID = id; }); else renderLabel();
}
function typeLabels() {
  L.nextType = null;

}
function setStage(stage) {
  L.nextStage = stage;
  if (L.selected) change(photo => { photo.boxes.find(b => b.id === L.selected).stage = stage; }); else renderLabel();
}
function addBox(rect) {
  if (L.nextType === null) { L.selected = null; askName({ rect }); return; }

  L.selected = box.id;

    L.selected = box.id;

function deleteBox() {

async function showPhoto(index) {
  L.index = index; L.selected = null; L.naming = null; L.zoom = 1; L.panX = L.panY = 0;

    view.setUint32(0, 0x02014b50, true); view.setUint16(4, 20, true);
    record.set(new Uint8Array(fields.buffer), 6); view.setUint32(42, offset, true); record.set(name, 46);
    parts.push(local, data); central.push(record);
    offset += local.length + data.size;
  }
  const size = central.reduce((sum, r) => sum + r.length, 0);
  if (offset + size > 0xfffffff0 || entries.length > 0xfffe) throw new Error("too large");
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
}

let exported = null;
/** Records that these photos are in a ZIP the user saved or sent. */
async function markExported(ids) {
  const changed = photos.filter(p => ids.has(p.id) && !p.exported);
  for (const photo of changed) photo.exported = true;
  await store("photos", "readwrite", s => { for (const photo of changed) s.put(photo); }).catch(() => {});
  renderCamera();
  if (!$("label").hidden) renderLabel();
}
/** Every photo on this phone goes into the ZIP, labelled or not, so that an export is also a complete copy. */
async function exportAll() {
  openDialog(h("h3", {}, "Exporting…"), h("p", { class: "dim" }, "Keep this page open."));
  try {
    const all = [...photos].sort((a, b) => a.at - b.at), data = buildDataset(all), labelled = all.filter(isLabelled);
    const entries = [];
    for (const photo of all) {
      const blob = await photoBlob(photo.id);
      if (!blob) throw new Error("missing photo");
      entries.push({ name: `Export/${isLabelled(photo) ? "images" : "unlabelled"}/${exportName(photo)}`, data: blob, at: photo.at });
    }
    for (const label of data.labels) entries.push({ name: `Export/labels/${label.name}`, data: label.text });
    entries.push({ name: "Export/annotations.json", data: JSON.stringify({ annotations: data.annotations, categories: data.categories, images: data.images }, null, 2) },
      { name: "Export/classes.txt", data: data.categories.map(c => c.name).join("\n") },
      { name: "Export/photos.geojson", data: JSON.stringify(data.geojson, null, 2) }, { name: "Export/README.txt", data: GUIDE });
    const blob = await zip(entries);
    const d = new Date(), two = n => String(n).padStart(2, "0");
    const file = new File([blob], `WeedAnnotator-${d.getFullYear()}${two(d.getMonth() + 1)}${two(d.getDate())}-${two(d.getHours())}${two(d.getMinutes())}.zip`, { type: "application/zip" });
    if (exported) URL.revokeObjectURL(exported.url);
    exported = { file, url: URL.createObjectURL(file) };
    const ids = new Set(all.map(p => p.id)), days = new Set(all.map(p => p.day)).size, unlabelled = all.length - labelled.length;
    const located = all.filter(p => p.location).length, missing = all.length - located;
    const canShare = navigator.canShare?.({ files: [file] });
    // The ZIP exists only in this page's memory until one of the two buttons puts it somewhere.
    const note = h("p", { class: "dim" }, `One ZIP file, ${(file.size / 1e6).toFixed(file.size < 1e7 ? 1 : 0)} MB. It is not saved yet: tap Save or Send.`);
    const saved = () => { markExported(ids); note.style.color = "var(--good)"; note.textContent = "Saved. These photos now count as exported; they also stay on this phone."; };
    openDialog(
      h("h3", {}, h("span", { style: "color:var(--good);display:inline-flex" }, icon("check")),
        labelled.length ? `${count(labelled.length, "labelled photo")} from ${count(days, "day")}` : `${count(all.length, "photo")}, none labelled yet`),
      unlabelled && labelled.length ? h("p", { class: "dim" }, `${count(unlabelled, "photo")} not labelled yet ${unlabelled === 1 ? "is" : "are"} included in a folder of ${unlabelled === 1 ? "its" : "their"} own.`) : null,
      missing ? h("p", { class: "warn" }, icon("pin"), located === 0 ? (all.length === 1 ? "It has no GPS position." : "None of them has a GPS position.") : missing === 1 ? "1 of them has no GPS position." : `${missing} of them have no GPS position.`) : null,
      note,
      h("div", { class: "actions" },
        h("a", { class: "btn", href: exported.url, download: file.name, onclick: saved }, "Save to this phone"),
        canShare ? h("button", { class: "btn", onclick: () => navigator.share({ files: [file] }).then(saved, () => {}) }, icon("export"), "Send…") : null,
        h("button", { class: "btn primary", onclick: closeDialog }, icon("check"), "Done")));
  } catch (error) {
    openDialog(h("h3", {}, "Export failed"),
      h("p", { class: "dim" }, error?.message === "too large" ? "There are more photos than one ZIP file can hold. Delete days that are already exported and try again." : "The phone may be out of memory or storage. Close other apps and try again."),
      h("div", { class: "actions" }, h("button", { class: "btn primary", onclick: closeDialog }, "OK")));
  }
}

// ---------- Start ----------

let wakeLock = null;
async function stayAwake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => {
  // The camera is let go while the page is out of sight, and taken again when it is back.
  if (document.hidden) stopCamera();
  else { stayAwake(); if (!$("camera").hidden) { cameraState = "starting"; renderCamera(); startCamera(); } }
});
window.addEventListener("orientationchange", () => setTimeout(draw, 300));

(async () => {
  try {
    db = await openDatabase();
    photos = (await store("photos", "readonly", s => s.getAll())).sort((a, b) => a.at - b.at);
  } catch {
    problem = "This browser will not store photos here. Private browsing does this: open the page in a normal tab.";
  }
  renderCamera();
  if (localStorage.getItem("guide") !== "seen") showGuide();
  watchPosition();
  stayAwake();
  startCamera();
  setInterval(renderStatus, 5000);
  $("exportnow").addEventListener("click", exportAll);
  // Asks the browser not to clear this page's storage when the phone runs short of space.
  navigator.storage?.persist?.().catch(() => {});
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
